<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统概览大屏化探索 - 应龙 AI 算力基座</title>
  <style>
    :root {
      --brand: #266eff;
      --cyan: #28d7ff;
      --mint: #41e6a1;
      --amber: #ffb84d;
      --danger: #ff5d78;
      --ink: #ecf7ff;
      --muted: #85a5bd;
      --bg: #040b18;
      --panel: rgba(10, 27, 51, .78);
      --line: rgba(111, 178, 222, .18);
      --font: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--bg); }
    body { overflow-x: hidden; color: var(--ink); font-family: var(--font); }
    button, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 2px solid #8ce9ff; outline-offset: 3px; }
    svg { display: block; }
    #stage { min-height: 100vh; }

    .screen {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% -20%, rgba(38, 110, 255, .20), transparent 42%),
        linear-gradient(180deg, #071426 0%, #040a14 100%);
    }
    .screen::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      opacity: .18;
      background-image:
        linear-gradient(rgba(89, 177, 226, .14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 177, 226, .14) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, #000 20%, transparent 92%);
      content: "";
    }
    .screen::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.42), transparent 18%, transparent 82%, rgba(0,0,0,.42)),
        radial-gradient(circle at center, transparent 52%, rgba(0, 4, 12, .55) 100%);
      content: "";
    }

    .screen-header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) auto minmax(230px, 1fr);
      align-items: center;
      min-height: 82px;
      padding: 12px clamp(18px, 2.2vw, 42px);
      border-bottom: 1px solid rgba(83, 175, 235, .15);
      background: linear-gradient(180deg, rgba(8, 22, 42, .96), rgba(5, 14, 28, .72));
    }
    .screen-header::after {
      position: absolute;
      right: 25%;
      bottom: -1px;
      left: 25%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 18px rgba(40, 215, 255, .9);
      content: "";
    }
    .brand-lockup { display: flex; min-width: 0; align-items: center; gap: 12px; color: #bcd6e8; }
    .brand-glyph { position: relative; display: grid; width: 42px; height: 42px; place-items: center; }
    .brand-glyph::before, .brand-glyph::after { position: absolute; inset: 4px; border: 1px solid rgba(63, 209, 255, .45); border-radius: 10px; content: ""; transform: rotate(45deg); }
    .brand-glyph::after { inset: 10px; border-color: rgba(38, 110, 255, .9); box-shadow: 0 0 18px rgba(38, 110, 255, .55); }
    .brand-glyph svg { position: relative; width: 20px; color: #d9f8ff; }
    .brand-text strong { display: block; color: #f5fbff; font-size: 14px; letter-spacing: .08em; }
    .brand-text span { display: block; margin-top: 2px; color: #6f98b4; font-size: 10px; letter-spacing: .12em; }
    .hero-title { text-align: center; }
    .hero-title h1 { margin: 0; font-size: clamp(20px, 1.65vw, 30px); font-weight: 650; letter-spacing: .18em; text-shadow: 0 0 26px rgba(66, 191, 255, .35); }
    .hero-title p { margin: 5px 0 0; color: #6f9bb7; font: 10px/1.2 var(--mono); letter-spacing: .24em; text-transform: uppercase; }
    .screen-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; color: #7ddfb4; font: 11px/1 var(--mono); }
    .live-dot::before { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px rgba(65, 230, 161, .8); content: ""; }
    .time-stamp { color: #6d91a9; font: 11px/1 var(--mono); }
    .icon-button, .ghost-button, .chip-button {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(103, 181, 231, .24);
      border-radius: 6px;
      color: #aacde2;
      background: rgba(12, 35, 59, .72);
      cursor: pointer;
      transition: border-color 180ms ease-out, color 180ms ease-out, background-color 180ms ease-out;
    }
    .ghost-button { padding: 0 14px; font-size: 12px; }
    .icon-button svg, .ghost-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .icon-button:hover, .ghost-button:hover { border-color: rgba(80, 216, 255, .6); color: #e8faff; background: rgba(23, 60, 91, .88); }
    .screen-main { padding: clamp(14px, 1.25vw, 24px) clamp(18px, 2.2vw, 42px) 76px; }
    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: linear-gradient(145deg, rgba(13, 35, 60, .83), rgba(6, 19, 37, .75));
      box-shadow: 0 16px 34px rgba(0, 0, 0, .16), inset 0 1px rgba(255,255,255,.025);
    }
    .panel::before, .panel::after { position: absolute; width: 18px; height: 18px; pointer-events: none; content: ""; }
    .panel::before { top: -1px; left: -1px; border-top: 2px solid rgba(54, 211, 255, .7); border-left: 2px solid rgba(54, 211, 255, .7); }
    .panel::after { right: -1px; bottom: -1px; border-right: 2px solid rgba(38, 110, 255, .72); border-bottom: 2px solid rgba(38, 110, 255, .72); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; padding: 9px 13px; border-bottom: 1px solid rgba(111, 178, 222, .12); }
    .panel-title { display: flex; align-items: center; gap: 8px; margin: 0; color: #d7efff; font-size: 12px; font-weight: 650; letter-spacing: .08em; }
    .panel-title::before { width: 3px; height: 13px; border-radius: 2px; background: var(--cyan); box-shadow: 0 0 10px rgba(40, 215, 255, .55); content: ""; }
    .panel-note { color: #6b91aa; font: 10px/1 var(--mono); }
    .mono { font-family: var(--mono); }
    .up { color: var(--mint); }
    .warn { color: var(--amber); }
    .bad { color: var(--danger); }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(1px,1px,1px,1px); white-space: nowrap; }

    /* Direction 1: command center */
    .command .screen-main { display: grid; grid-template-columns: minmax(228px, .78fr) minmax(430px, 1.7fr) minmax(240px, .82fr); gap: clamp(12px, 1vw, 20px); }
    .command-col { display: grid; align-content: start; gap: 14px; }
    .metric-stack { display: grid; gap: 9px; padding: 12px; }
    .metric-card { position: relative; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 10px; min-height: 76px; padding: 10px 11px; border: 1px solid rgba(83, 175, 235, .12); background: rgba(6, 22, 41, .54); }
    .metric-icon { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid rgba(42, 197, 255, .25); border-radius: 50%; color: #64dfff; background: radial-gradient(circle, rgba(38, 110, 255, .18), transparent 70%); }
    .metric-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .metric-label { color: #7899b0; font-size: 10px; }
    .metric-value { margin-top: 2px; color: #ecf9ff; font: 650 clamp(20px, 1.55vw, 28px)/1 var(--mono); letter-spacing: -.04em; }
    .metric-unit { margin-left: 4px; color: #6d8da5; font-size: 10px; }
    .metric-trend { align-self: end; padding-bottom: 3px; font: 10px/1 var(--mono); }
    .mini-bars { display: grid; grid-template-columns: repeat(10, 1fr); align-items: end; height: 28px; gap: 3px; margin: 10px 12px 13px; }
    .mini-bars i { display: block; height: calc(var(--v) * 1%); min-height: 3px; background: linear-gradient(#4de1ff, rgba(38,110,255,.28)); opacity: .8; }
    .topology-panel { min-height: clamp(430px, 55vh, 650px); }
    .topology { position: relative; min-height: clamp(380px, calc(55vh - 44px), 606px); overflow: hidden; }
    .topology::before { position: absolute; inset: 7% 13%; border: 1px solid rgba(72, 190, 240, .12); border-radius: 50%; box-shadow: 0 0 0 42px rgba(55, 139, 210, .035), 0 0 0 84px rgba(55, 139, 210, .022); content: ""; }
    .orbit { position: absolute; inset: 11% 19%; border: 1px dashed rgba(83, 190, 241, .18); border-radius: 50%; }
    .topology-lines { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .65; }
    .topology-lines line { stroke: url(#lineGradient); stroke-width: 1; stroke-dasharray: 4 7; }
    .core-ring { position: absolute; top: 50%; left: 50%; display: grid; width: clamp(164px, 16vw, 230px); aspect-ratio: 1; place-items: center; border: 1px solid rgba(55, 215, 255, .32); border-radius: 50%; background: radial-gradient(circle, rgba(30, 101, 173, .30), rgba(4, 16, 31, .9) 68%); box-shadow: 0 0 60px rgba(38, 110, 255, .18), inset 0 0 34px rgba(40, 215, 255, .08); transform: translate(-50%, -50%); }
    .core-ring::before, .core-ring::after { position: absolute; border-radius: 50%; content: ""; }
    .core-ring::before { inset: 12px; border: 1px dashed rgba(57, 190, 241, .32); }
    .core-ring::after { inset: 29px; border: 1px solid rgba(52, 138, 231, .38); }
    .core-copy { position: relative; z-index: 1; text-align: center; }
    .core-copy span { display: block; color: #7fa7c2; font-size: 10px; letter-spacing: .15em; }
    .core-copy strong { display: block; margin: 8px 0 3px; color: #f1fbff; font: 700 clamp(30px, 3vw, 52px)/1 var(--mono); text-shadow: 0 0 26px rgba(40,215,255,.4); }
    .core-copy small { color: #58d9ff; font-size: 11px; }
    .topo-node { position: absolute; display: grid; min-width: 86px; min-height: 52px; place-items: center; padding: 7px 9px; border: 1px solid rgba(81, 182, 232, .28); border-radius: 4px; color: #ccecff; background: rgba(6, 25, 45, .88); box-shadow: 0 0 22px rgba(10, 117, 194, .12); text-align: center; }
    .topo-node strong { display: block; font: 650 12px/1.2 var(--mono); }
    .topo-node span { display: block; margin-top: 4px; color: #6590aa; font-size: 9px; }
    .topo-node::before { position: absolute; top: 50%; left: -4px; width: 7px; height: 7px; border: 1px solid #47d6ff; border-radius: 50%; background: #08213b; box-shadow: 0 0 9px #36cfff; content: ""; transform: translateY(-50%); }
    .topo-node.n1 { top: 14%; left: 8%; }
    .topo-node.n2 { top: 14%; right: 8%; }
    .topo-node.n3 { bottom: 16%; left: 8%; }
    .topo-node.n4 { right: 8%; bottom: 16%; }
    .status-legend { position: absolute; right: 14px; bottom: 11px; display: flex; gap: 12px; color: #668aa2; font-size: 9px; }
    .status-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .status-legend i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .alert-list { display: grid; gap: 9px; padding: 11px; }
    .alert-row { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 10px; padding: 10px 10px 10px 0; border-bottom: 1px solid rgba(104, 169, 210, .1); }
    .alert-row:last-child { border-bottom: 0; }
    .alert-severity { border-radius: 4px; background: var(--amber); box-shadow: 0 0 12px rgba(255,184,77,.32); }
    .alert-severity.high { background: var(--danger); box-shadow: 0 0 12px rgba(255,93,120,.32); }
    .alert-name { color: #d7edf9; font: 600 11px/1.4 var(--mono); }
    .alert-copy { margin-top: 4px; color: #6f91a7; font-size: 9px; line-height: 1.5; }
    .alert-time { color: #7093aa; font: 9px/1.4 var(--mono); }
    .util-list { display: grid; gap: 13px; padding: 14px; }
    .util-row { display: grid; grid-template-columns: 70px 1fr 38px; align-items: center; gap: 8px; color: #87a8bd; font-size: 10px; }
    .util-track { height: 6px; overflow: hidden; background: rgba(80, 132, 165, .13); }
    .util-track i { display: block; width: calc(var(--v) * 1%); height: 100%; background: linear-gradient(90deg, #266eff, #2cd7ff); box-shadow: 0 0 12px rgba(40,215,255,.32); }
    .util-row strong { color: #d9eef9; font: 600 10px/1 var(--mono); text-align: right; }
    .command-footer { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); overflow: hidden; }
    .footer-kpi { padding: 11px 15px; border-right: 1px solid rgba(96, 168, 209, .12); }
    .footer-kpi:last-child { border-right: 0; }
    .footer-kpi span { color: #6b8ca3; font-size: 9px; }
    .footer-kpi strong { display: block; margin-top: 5px; color: #dff6ff; font: 650 16px/1 var(--mono); }

    /* Direction 2: data canopy */
    .canopy { --cyan: #75b8ff; background: radial-gradient(circle at 55% -5%, rgba(72, 92, 255, .28), transparent 43%), linear-gradient(180deg, #070b1b, #050814); }
    .canopy::before { opacity: .11; background-size: 52px 52px; }
    .canopy .screen-header { background: rgba(7, 10, 27, .76); }
    .canopy .screen-header::after { background: linear-gradient(90deg, transparent, #8b7cff, #56c7ff, transparent); }
    .canopy .screen-main { display: grid; gap: 14px; }
    .canopy-kpis { display: grid; grid-template-columns: 1.35fr repeat(4, 1fr); gap: 12px; }
    .canopy-kpi { position: relative; min-height: 102px; overflow: hidden; padding: 15px 16px; border: 1px solid rgba(131, 151, 255, .16); background: linear-gradient(140deg, rgba(25, 30, 67, .74), rgba(10, 16, 38, .74)); }
    .canopy-kpi:first-child { background: linear-gradient(135deg, rgba(54, 77, 181, .40), rgba(14, 23, 59, .82)); }
    .canopy-kpi::after { position: absolute; right: -24px; bottom: -46px; width: 112px; height: 112px; border: 1px solid rgba(132, 150, 255, .17); border-radius: 50%; box-shadow: 0 0 0 19px rgba(104, 127, 255, .035); content: ""; }
    .canopy-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #8992b7; font-size: 10px; letter-spacing: .05em; }
    .canopy-number { margin-top: 11px; color: #f0f4ff; font: 670 clamp(24px, 2.2vw, 38px)/1 var(--mono); letter-spacing: -.05em; }
    .canopy-number small { margin-left: 5px; color: #7e87aa; font: 10px/1 var(--font); letter-spacing: 0; }
    .canopy-delta { margin-top: 9px; color: #56dfae; font: 10px/1 var(--mono); }
    .time-controls { display: inline-flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid rgba(122, 144, 233, .18); border-radius: 6px; background: rgba(8, 12, 30, .55); }
    .chip-button { min-width: 44px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 4px; color: #7882a8; background: transparent; font-size: 10px; }
    .chip-button.active { color: #edf1ff; background: rgba(105, 118, 255, .22); box-shadow: inset 0 0 0 1px rgba(139, 146, 255, .25); }
    .canopy-chart { min-height: clamp(300px, 41vh, 480px); }
    .chart-canvas { position: relative; height: clamp(252px, calc(41vh - 48px), 432px); overflow: hidden; padding: 8px 13px 12px; }
    .chart-canvas svg { width: 100%; height: 100%; overflow: visible; }
    .chart-grid line { stroke: rgba(134, 154, 216, .10); stroke-width: 1; }
    .chart-area { fill: url(#areaFill); }
    .chart-line { fill: none; stroke: #67c9ff; stroke-width: 2.4; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 6px rgba(86, 194, 255, .55)); }
    .chart-line.alt { stroke: #9a89ff; stroke-width: 1.5; stroke-dasharray: 5 5; filter: none; }
    .chart-point { fill: #071127; stroke: #ff728b; stroke-width: 2; }
    .chart-label { fill: #6e78a0; font: 9px var(--mono); }
    .chart-tooltip { position: absolute; top: 20%; left: 57%; padding: 8px 10px; border: 1px solid rgba(116, 196, 255, .30); border-radius: 4px; color: #cfeaff; background: rgba(5, 13, 31, .92); box-shadow: 0 10px 26px rgba(0,0,0,.3); font-size: 9px; line-height: 1.6; }
    .chart-tooltip strong { display: block; font: 650 15px/1.4 var(--mono); }
    .canopy-bottom { display: grid; grid-template-columns: 1.35fr .9fr .9fr; gap: 14px; }
    .cluster-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 11px; }
    .cluster-cell { padding: 11px; border: 1px solid rgba(125, 144, 220, .12); border-radius: 4px; background: rgba(11, 18, 42, .62); }
    .cluster-cell-top { display: flex; align-items: center; justify-content: space-between; color: #8c96ba; font-size: 9px; }
    .cluster-cell strong { display: block; margin-top: 7px; color: #e3e8ff; font: 650 16px/1 var(--mono); }
    .cluster-spark { display: grid; grid-template-columns: repeat(8,1fr); align-items: end; height: 22px; gap: 2px; margin-top: 10px; }
    .cluster-spark i { height: calc(var(--v) * 1%); min-height: 2px; background: #7787ff; opacity: .72; }
    .service-list { padding: 6px 12px 11px; }
    .service-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(127, 145, 215, .09); }
    .service-row:last-child { border-bottom: 0; }
    .service-row strong { color: #d9e0ff; font: 600 10px/1.2 var(--mono); }
    .service-row span { display: block; margin-top: 3px; color: #727da3; font-size: 8px; }
    .service-row b { align-self: center; color: #9faae0; font: 600 10px/1 var(--mono); }
    .event-list { display: grid; gap: 7px; padding: 10px 12px 12px; }
    .event-item { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start; }
    .event-item time { padding-top: 1px; color: #7782a6; font: 9px/1.4 var(--mono); }
    .event-item p { margin: 0; color: #bac4e5; font-size: 9px; line-height: 1.5; }
    .event-item p span { color: #ffb164; }

    /* Direction 3: star matrix */
    .starmap { background: radial-gradient(circle at 50% 42%, rgba(0, 158, 196, .16), transparent 35%), linear-gradient(180deg, #031118, #02080e); }
    .starmap::before { opacity: .12; background-size: 64px 64px; }
    .starmap .screen-header { min-height: 72px; border-bottom: 0; background: rgba(3, 14, 21, .74); }
    .starmap .screen-header::after { right: 7%; left: 7%; height: 1px; background: linear-gradient(90deg, transparent, rgba(41, 210, 236, .62) 20%, rgba(41, 210, 236, .62) 80%, transparent); }
    .starmap .screen-main { display: grid; grid-template-columns: minmax(235px, .76fr) minmax(500px, 1.75fr) minmax(235px, .76fr); min-height: calc(100vh - 72px); gap: 14px; padding-top: 14px; }
    .rail { display: grid; align-content: start; gap: 12px; }
    .rail-card { padding: 13px; border-left: 1px solid rgba(68, 216, 231, .32); background: linear-gradient(90deg, rgba(8, 36, 45, .64), transparent); }
    .rail.right .rail-card { border-right: 1px solid rgba(68, 216, 231, .32); border-left: 0; background: linear-gradient(270deg, rgba(8, 36, 45, .64), transparent); text-align: right; }
    .rail-label { color: #648f98; font-size: 9px; letter-spacing: .12em; }
    .rail-value { margin-top: 7px; color: #ddf8f9; font: 650 25px/1 var(--mono); }
    .rail-value small { margin-left: 3px; color: #648b94; font: 9px/1 var(--font); }
    .rail-meter { position: relative; height: 3px; margin-top: 11px; background: rgba(75, 154, 163, .12); }
    .rail-meter i { display: block; width: calc(var(--v) * 1%); height: 100%; background: linear-gradient(90deg, #1ea8bd, #4df1d0); box-shadow: 0 0 9px rgba(77,241,208,.28); }
    .rail.right .rail-meter i { margin-left: auto; background: linear-gradient(270deg, #1ea8bd, #4df1d0); }
    .center-map { position: relative; min-height: clamp(560px, 74vh, 760px); overflow: hidden; border: 1px solid rgba(71, 196, 210, .10); background: radial-gradient(circle at center, rgba(13, 70, 83, .26), transparent 58%); }
    .center-map::before, .center-map::after { position: absolute; inset: 50% auto auto 50%; border: 1px solid rgba(57, 194, 207, .16); border-radius: 50%; content: ""; transform: translate(-50%, -50%); }
    .center-map::before { width: 74%; aspect-ratio: 1; box-shadow: 0 0 0 58px rgba(37, 165, 183, .025), 0 0 0 116px rgba(37, 165, 183, .018); }
    .center-map::after { width: 45%; aspect-ratio: 1; border-style: dashed; }
    .axis-x, .axis-y { position: absolute; background: linear-gradient(90deg, transparent, rgba(63, 210, 223, .22), transparent); }
    .axis-x { top: 50%; right: 7%; left: 7%; height: 1px; }
    .axis-y { top: 7%; bottom: 7%; left: 50%; width: 1px; background: linear-gradient(180deg, transparent, rgba(63, 210, 223, .22), transparent); }
    .map-core { position: absolute; top: 50%; left: 50%; display: grid; width: clamp(146px, 13vw, 196px); aspect-ratio: 1; place-items: center; border: 1px solid rgba(79, 238, 213, .34); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background: radial-gradient(circle, rgba(41, 159, 160, .3), rgba(3, 20, 27, .94) 67%); box-shadow: 0 0 46px rgba(43, 207, 210, .18); transform: translate(-50%, -50%); }
    .map-core::before { position: absolute; inset: 14%; border: 1px solid rgba(62, 220, 208, .23); clip-path: inherit; content: ""; }
    .map-core-copy { position: relative; z-index: 1; text-align: center; }
    .map-core-copy span { color: #71adb0; font-size: 9px; letter-spacing: .12em; }
    .map-core-copy strong { display: block; margin: 8px 0 4px; color: #eafffb; font: 700 clamp(27px, 2.4vw, 42px)/1 var(--mono); }
    .map-core-copy small { color: #50e1ce; font-size: 9px; }

              <div class="chart-tooltip"><span>14:18 · 异常峰值</span><strong>1,486 QPS</strong><span>knowledge-rag 重试请求增加</span></div>
            </div>
          </section>

          <section class="canopy-bottom">
            <article class="panel"><div class="panel-head"><h2 class="panel-title">集群负载带</h2><span class="panel-note">从高到低排序</span></div><div class="cluster-grid">
              ${[['生产 A','91%',[42,54,71,82,75,91,88,94]],['智算 C','84%',[48,60,55,69,74,70,81,84]],['生产 B','78%',[38,43,56,68,71,75,76,78]],['测试池','36%',[20,31,28,35,42,38,33,36]]].map(([n,v,b])=>`<div class="cluster-cell"><div class="cluster-cell-top"><span>${n}</span><span>${v}</span></div><strong>${v}</strong><div class="cluster-spark">${barSet(b)}</div></div>`).join('')}
            </div></article>
            <article class="panel"><div class="panel-head"><h2 class="panel-title">服务吞吐排行</h2><button class="ghost-button" type="button" data-action="details">详情</button></div><div class="service-list">
              <div class="service-row"><div><strong>qwen3-32b</strong><span>24 实例 · 在线</span></div><b>128.6K</b></div><div class="service-row"><div><strong>qwen2-2.5</strong><span>10 实例 · 在线</span></div><b>96.2K</b></div><div class="service-row"><div><strong>whisper-large-v3</strong><span>6 实例 · 在线</span></div><b>42.8K</b></div><div class="service-row"><div><strong>minimax-abab6.5</strong><span>0 实例 · 离线</span></div><b class="bad">0</b></div>
            </div></article>
            <article class="panel"><div class="panel-head"><h2 class="panel-title">实时事件</h2><span class="panel-note">EVENT STREAM</span></div><div class="event-list">
              <div class="event-item"><time>14:30:42</time><p>生产集群 B 扩容 <span>+2 实例</span></p></div><div class="event-item"><time>14:28:16</time><p>qwen3-32b 触发 <span>SLA 预警</span></p></div><div class="event-item"><time>14:24:51</time><p>资源申请 RA-0912 已通过</p></div><div class="event-item"><time>14:19:04</time><p>gpu-node-23 <span>心跳异常</span></p></div>
            </div></article>
          </section>
        </div>
      </div>`;

    const starMatrix = () => `
      <div class="screen starmap variant-enter">
        ${header('COMPUTE CONSTELLATION · RESOURCE ORCHESTRATION')}
        <div class="screen-main">
          <aside class="rail left">
            <section class="panel"><div class="panel-head"><h2 class="panel-title">资源水位</h2><span class="panel-note">LIVE</span></div>
              <div class="rail-card"><div class="rail-label">GPU 利用率</div><div class="rail-value">76.4<small>%</small></div><div class="rail-meter"><i style="--v:76.4"></i></div></div>
              <div class="rail-card"><div class="rail-label">显存使用率</div><div class="rail-value">81.2<small>%</small></div><div class="rail-meter"><i style="--v:81.2"></i></div></div>
              <div class="rail-card"><div class="rail-label">空闲加速卡</div><div class="rail-value">61<small>卡</small></div><div class="rail-meter"><i style="--v:16"></i></div></div>
              <div class="rail-card"><div class="rail-label">机房功耗</div><div class="rail-value">428<small>kW</small></div><div class="rail-meter"><i style="--v:68"></i></div></div>
            </section>
            <section class="panel"><div class="panel-head"><h2 class="panel-title">调度队列</h2><span class="panel-note">6 TASKS</span></div><div class="queue">
              <div class="queue-row"><span class="queue-index">01</span><span class="queue-name">finance-agent-eval</span><span class="queue-state">运行中</span></div><div class="queue-row"><span class="queue-index">02</span><span class="queue-name">speech-batch-0905</span><span class="queue-state">运行中</span></div><div class="queue-row"><span class="queue-index">03</span><span class="queue-name">medical-rag-index</span><span class="queue-state pending">排队</span></div><div class="queue-row"><span class="queue-index">04</span><span class="queue-name">qwen3-lora-train</span><span class="queue-state pending">排队</span></div>
            </div></section>
          </aside>

          <section class="center-map" aria-label="算力节点星图，中央为平台健康指数，周围为六个资源域">
            <div class="matrix-tabs" role="group" aria-label="星图层级"><button class="chip-button active" data-map="cluster">集群</button><button class="chip-button" data-map="service">服务</button><button class="chip-button" data-map="task">任务</button></div>
            <span class="axis-x"></span><span class="axis-y"></span>
            <svg class="map-links" viewBox="0 0 800 650" preserveAspectRatio="none" aria-hidden="true"><line x1="400" y1="325" x2="170" y2="115"/><line x1="400" y1="325" x2="635" y2="120"/><line x1="400" y1="325" x2="75" y2="320"/><line x1="400" y1="325" x2="725" y2="320"/><line x1="400" y1="325" x2="180" y2="545"/><line x1="400" y1="325" x2="620" y2="545"/><path d="M170 115 Q400 30 635 120"/><path d="M180 545 Q400 620 620 545"/></svg>
            <div class="map-core"><div class="map-core-copy"><span>平台健康指数</span><strong>96.8</strong><small>正常运行</small></div></div>
            <div class="star-node s1"><i></i><span>生产集群 A<small>128 卡 · 91%</small></span></div><div class="star-node s2"><i></i><span>生产集群 B<small>144 卡 · 78%</small></span></div><div class="star-node s3 alert"><i></i><span>故障域 01<small>1 节点异常</small></span></div><div class="star-node s4"><i></i><span>智算集群 C<small>80 卡 · 84%</small></span></div><div class="star-node s5"><i></i><span>训练资源池<small>18 任务 · 63%</small></span></div><div class="star-node s6"><i></i><span>测试资源池<small>32 卡 · 36%</small></span></div>
            <div class="matrix-legend"><span><i></i>正常资源域</span><span><i></i>异常资源域</span></div>
          </section>

          <aside class="rail right">
            <section class="panel"><div class="panel-head"><h2 class="panel-title">服务态势</h2><span class="panel-note">24 INSTANCES</span></div>
              <div class="rail-card"><div class="rail-label">模型服务在线</div><div class="rail-value">17<small>/ 18</small></div><div class="rail-meter"><i style="--v:94"></i></div></div>
              <div class="rail-card"><div class="rail-label">推理吞吐</div><div class="rail-value">4.82<small>M/min</small></div><div class="rail-meter"><i style="--v:82"></i></div></div>
              <div class="rail-card"><div class="rail-label">平均时延</div><div class="rail-value">286<small>ms</small></div><div class="rail-meter"><i style="--v:57"></i></div></div>
              <div class="rail-card"><div class="rail-label">请求成功率</div><div class="rail-value">99.12<small>%</small></div><div class="rail-meter"><i style="--v:99"></i></div></div>
            </section>
            <section class="panel"><div class="panel-head"><h2 class="panel-title">风险轨道</h2><button class="ghost-button" type="button" data-action="details">诊断</button></div><div class="risk-ticker">
              <div class="risk-ticker-item"><div><strong>gpu-node-23</strong><span>心跳中断 · 承载 2 实例</span></div><b>18 min</b></div><div class="risk-ticker-item"><div><strong>knowledge-rag</strong><span>失败率超过 2% 阈值</span></div><b>3.26%</b></div><div class="risk-ticker-item"><div><strong>qwen3-32b</strong><span>SLA 失败率预警</span></div><b>2.84%</b></div>
            </div></section>
          </aside>
        </div>
      </div>`;

    const variants = [commandCenter, dataCanopy, starMatrix];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    let clockTimer;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function openDetails() {
      document.body.insertAdjacentHTML('beforeend', `<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><section class="modal-card"><header><h2 id="detailTitle">全域运行摘要</h2><button class="icon-button" type="button" data-action="close-modal" aria-label="关闭">${icon('x')}</button></header><div class="modal-body">当前 42 个节点在线，384 张 GPU / NPU 中有 61 张空闲。平台健康指数为 96.8，建议优先处理 gpu-node-23 心跳异常与 qwen3-32b SLA 预警。<div class="modal-grid"><div class="modal-stat"><span>在线节点</span><strong>42 / 43</strong></div><div class="modal-stat"><span>运行服务</span><strong>17 / 18</strong></div><div class="modal-stat"><span>活跃预警</span><strong class="warn">3</strong></div></div></div></section></div>`);
      document.querySelector('[data-action="close-modal"]').focus();
    }

    function wireVariant() {
      clearInterval(clockTimer);
      const clock = stage.querySelector('[data-clock]');
      const updateClock = () => { if (clock) clock.textContent = new Intl.DateTimeFormat('zh-CN', { dateStyle: 'short', timeStyle: 'medium', hour12: false }).format(new Date()).replaceAll('/', '-'); };
      updateClock();
      clockTimer = setInterval(updateClock, 1000);
      stage.querySelectorAll('.time-controls .chip-button[data-range]').forEach(btn => btn.addEventListener('click', () => {
        stage.querySelectorAll('.time-controls .chip-button[data-range]').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        const note = stage.querySelector('.canopy-chart .panel-title');
        if (note) note.textContent = `全域请求流量 · ${btn.textContent} 实际与基线`;
      }));
      stage.querySelectorAll('.matrix-tabs .chip-button').forEach(btn => btn.addEventListener('click', () => {
        stage.querySelectorAll('.matrix-tabs .chip-button').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        const coreLabel = stage.querySelector('.map-core-copy span');
        if (coreLabel) coreLabel.textContent = btn.dataset.map === 'cluster' ? '平台健康指数' : btn.dataset.map === 'service' ? '服务健康指数' : '任务健康指数';
      }));
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); wireVariant(); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('click', (e) => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'fullscreen') {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else document.documentElement.requestFullscreen?.();
      } else if (action === 'details') openDetails();
      else if (action === 'close-modal' || (e.target.classList.contains('modal-layer'))) document.querySelector('.modal-layer')?.remove();
      else if (action === 'pause') {
        const button = e.target.closest('button');
        button.textContent = button.textContent === '暂停' ? '继续' : '暂停';
        button.setAttribute('aria-pressed', button.textContent === '继续' ? 'true' : 'false');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') document.querySelector('.modal-layer')?.remove();
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
